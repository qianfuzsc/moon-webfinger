name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hustcer/setup-moonbit@v1.22
      - name: Toolchain
        run: moon version --all
      - name: Format
        run: moon fmt --check
      - name: Public API
        run: moon info
      - name: Strict check
        run: moon check --target all --deny-warn
      - name: Build
        run: moon build --target all
      - name: Strict tests
        run: moon test --target all --deny-warn
      - name: CLI smoke tests
        run: |
          moon run --target wasm-gc cmd/webfinger-tool version
          moon run --target js cmd/webfinger-tool version
      - name: Runnable examples
        shell: bash
        run: |
          set -euo pipefail
          for example in build_request parse_jrd query_links audit_response build_jrd; do
            moon run --target wasm-gc "examples/$example"
          done
      - name: Metrics and package manifest
        run: |
          python scripts/count_code.py
          moon package --list
